# it.ccra.tw  資訊服務申請頁（2026-10-03 IT大蘇建立，熊哥 TG 交辦）
# 憑證沿用 Cloudflare Origin 憑證（SAN *.ccra.tw）；登入由 Cloudflare Access 把關，PHP 端另驗 JWT（/var/www/it-lib/access.php）
server {
    listen 80;
    server_name it.ccra.tw;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name it.ccra.tw;
    root /var/www/it.ccra.tw;
    include snippets/cloudflare-only.conf;
    index index.php index.html;
    ssl_certificate /home/azureuser/ssl/ccra.tw.pem;
    ssl_certificate_key /home/azureuser/ssl/ccra.tw.key;
    access_log /var/log/nginx/it.ccra.tw.access.log;
    error_log  /var/log/nginx/it.ccra.tw.error.log;
    location / { }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ /\. { deny all; return 404; }
}
