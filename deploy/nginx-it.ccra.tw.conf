# it.ccra.tw  資訊服務入口（內部主機 ITSrv01，經 Cloudflare Tunnel 對外）
# 只聽 127.0.0.1：外界唯一的進入路徑是 cloudflared → localhost。
# 登入由 Cloudflare Access 把關，PHP 端另驗 JWT（/var/www/it-lib/access.php）。
server {
    listen 127.0.0.1:80;
    server_name it.ccra.tw;
    root /var/www/it.ccra.tw;
    index index.php index.html;
    access_log /var/log/nginx/it.ccra.tw.access.log;
    error_log  /var/log/nginx/it.ccra.tw.error.log;
    location / { }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }
    location ~ /\. { deny all; return 404; }
}
